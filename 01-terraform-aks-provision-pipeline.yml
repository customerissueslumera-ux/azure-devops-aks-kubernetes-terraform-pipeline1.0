trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

#Define Environment variables:
variables:
  - name: DEV_ENVIRONMENT
    value: dev
  - name: QA_ENVIRONMENT
    value: qa

#Stage -1 : Validate Terraform stage
##Step 1 : Publish artifacts to pipeline
##Step 2 : Install latest Terraform
##step 3 : validate terraform manifests

stages:
  - stage: TerraformValidate
    jobs: 
      - job: TerafromvalidateJob
        continueOnError: false
        steps:
          - task: PublishPipelineArtifact@1
            displayName: Publish Artifcats
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/terraform-manifests'
              artifact: 'terraform-manifests-out'
              publishlocation: 'pipeline'

          - task: TerraformInstaller@1
            displayName: Terraform Install
            inputs:
              terraformVersion: 'latest'
          
          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform-manifests'
              backendServiceArm: 'terraform-aks-azurerm-svc-con'
              backendAzureRmOverrideSubscriptionID: 'c5484afe-88cc-4870-8cc5-4582d2ec0e6f'
              backendAzureRmResourceGroupName: 'AKS-Course'
              backendAzureRmStorageAccountName: 'terraformtf'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'aks-terraform.tfstate'
          
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform-manifests'
              allowTelemetryCollection: false

#Stage 2: Deploy Stages for Dev and QA
#Deployment-1: Deploy Dev AKS Cluster
## Step-1: define variables for environments
## Step-2: Download SSH Secure File
## Step-3: Terrafrom Initalize
## Step-4: Terroform Plan
## Step-5: Terraform Apply
  - stage: DeployAKSCluster
    jobs:
      - deployment: DeployDevAKSCluster
        displayName: DeployDevAKSCluster
        pool:
          vmImage: 'ubuntu-latest'
        environment: $(DEV_ENVIRONMENT)
        strategy: 
          runOnce:
            deploy:
              steps:
                - task: DownloadSecureFile@1
                  displayName: Download SSH Key
                  name: sshkey
                  inputs:
                    secureFile: 'aks-terraform-devops-ssh-key-ububtu.pub'

                - task: TerraformInstaller@1
                  displayName: Terraform Install
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTask@5
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(Pipeline.Workspace)/terraform-manifests-out'
                    backendAzureRmUseEntraIdForAuthentication: false
                    backendServiceArm: 'terraform-aks-azurerm-svc-con'
                    backendAzureRmOverrideSubscriptionID: 'c5484afe-88cc-4870-8cc5-4582d2ec0e6f'
                    backendAzureRmResourceGroupName: 'AKS-Course'
                    backendAzureRmStorageAccountName: 'terraformtf'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'aks-$(DEV_ENVIRONMENT).tfstate'
                
                ###Temporary
                - task: TerraformTask@5
                  displayName: Terraform Force Unlock (TEMP - remove after use)
                  inputs:
                    provider: 'azurerm'
                    command: 'custom'
                    workingDirectory: '$(Pipeline.Workspace)/terraform-manifests-out'
                    customCommand: 'force-unlock'
                    commandOptions: '-force 671e7bd5-94aa-f764-17e2-586620702777'
                    environmentServiceNameAzureRM: 'terraform-aks-azurerm-svc-con'

                - task: TerraformTask@5
                  displayName: Terraform Plan
                  inputs:
                      provider: 'azurerm'
                      command: 'plan'
                      workingDirectory: '$(Pipeline.Workspace)/terraform-manifests-out'
                      commandOptions: '-var ssh_public_key=$(sshkey.secureFilePath)  -var environment=$(DEV_ENVIRONMENT)  -out $(Pipeline.Workspace)/terraform-manifests-out/$(DEV_ENVIRONMENT)-$(Build.BuildId).out'
                      environmentServiceNameAzureRM: 'terraform-aks-azurerm-svc-con'  
                
                - task: TerraformTask@5
                  displayName: Terraform Apply
                  inputs:
                      provider: 'azurerm'
                      command: 'apply'
                      workingDirectory: '$(Pipeline.Workspace)/terraform-manifests-out/'
                      commandOptions: '$(DEV_ENVIRONMENT)-$(Build.BuildId).out'
                      environmentServiceNameAzureRM: 'terraform-aks-azurerm-svc-con'
